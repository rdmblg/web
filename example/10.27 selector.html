<!-- id 셀렉터와 class 셀렉터 비교
id 셀렉터
: id 속성의 목적을 각 태그를 유일하게 구분
id 속성이 같지 않도록 HTML 태그를 작성하는 것이 바람직
자바스크립트코드에서 id 값을 가진 태그 객체를 찾을 때 문제됨
id 셀렉터는 여러 태그 중 특정 태그에만 css 스타일을 적용할 때 적합

class셀렉터
: 여러 태그를 하나의 그룹으로 묶어 단체로 동일한 css 스타일을 적용할 때 적합
class 속성 값이 같은 태그에 모두 css 스타일 적용
태그의 종류에 관계없이 class 셀렉터 활용 가능 -->


<!-- 셀렉터 조합하기
2개 이상의 셀렉터 조합
조합에 적합한 HTML 태그에만 적용
두 가지 조합 방법 : 자식 셀렉터와 자손 셀렉터

자식 셀렉터
: 부모 자식 관계인 두 셀렉터를 > 기호로 조합
div > strong { color : dodgerblue;}
<div>의 직계 자식인 strong에 적용되는 스타일 시트

자손 셀렉터
: 자손 관계인 2개 이상의 태그 나열
자식은 자손에 포함됨
ul strong { color : dodgerblue; }
ul의 자손 strong에 적용되는 스타일 시트

<head>
    <style>
        div > strong { background-color: yellow;}
        ul strong { color : dodgerblue; }
    </style>
</head>

<div>
    <div>2학기 <strong>학습 내용</strong></div>
    <ul>
        <li>HTML5</li>
        <li><strong>CSS</strong></li>
        <li>JAVASCRIPT</li>
    </ul>
    <div>60점 이하는 F!</div>
</div> -->

<!--자손은 자식도 포함되기 때문에 <li>를 생략해도 동일하게 dodgerblue가 적용이 됨

자손 셀렉터와 자식 셀렉터가 중복되는 경우는 자식 셀렉터가 우선 순위가 높음 
엄 p32참고-->


전체 셀렉터
와일드 문자(*)를 사용하여 모든 태그에 적용시키는 셀렉터
* { color : grren;}
