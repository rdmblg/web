        <table>

                <td><input type="text" value=""></td></tr>

<h3>도형 서식 폼 만들기</h3>
<hr>

<form>
    <fieldset>
        <legend>도형 서식 입력</legend>
        선종류 <select size="3" name="ex">
            <option value="1">선없음</option>
            <option value="2">실선</option>
            <option value="3">점선</option>
        </select>

        <br>
        <label>
        선두께 <input type="text" value="2" size="4"></label>
        <lable>선색 <input type="color" value="#0000bb"><br></label>

        투명도(0~100) : <input type="range" min="0" max="100" list="a">
        <datalist id="a">
        <option value="0"></option>
        <option value="50"></option>
        <option value="100"></option>
        </datalist>
    </fieldset>
</form>

<form>
<p>
<span>학년</span> 
<label><input type="radio" value="1" name="grade" checked>1학년</label>
<label><input type="radio" value="2" name="grade">2학년</label>
<label><input type="radio" value="3" name="grade">3학년</label>
<label><input type="radio" value="4" name="grade">4학년</label>
</p>

<p>
<span>성별</span>
<label><input type="radio" value="1" name="gender" checked>남</label>
<label><input type="radio" value="2" name="gender">여</label>
</p>

<p>
<span>관심 분야</span>
<input type="text" list="interest" name="interest">
<datalist id="interest">
    <option value="모바일 소프트웨어"></option>
    <option value="전자 전기 공학"></option>
    <option value="컴퓨터 인공지능"></option>
</datalist>
</p>

<p>
<span>진로</span>
<label><input type="checkbox" value="1" name="future" checked>개발</label>
<label><input type="checkbox" value="2" name="future">기획</label>
<label><input type="checkbox" value="3" name="future">영업</label>
<label><input type="checkbox" value="4" name="future">창업</label>
</p>

<p>
<span>남기고 싶은 말</span>
<textarea rows="10" cols="50" placeholder="글을 남겨주세요" name="memo"></textarea>
</p>

<p>
<input type="submit" value="제출">
<input type="reset" value="취소">
</p>
