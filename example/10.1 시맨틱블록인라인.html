<!-- <details></details>, <summary></summary>
두 태그는 접었다 펼 수 있는 정보를 표현하기 위한 의미있는 구조를 제공
<details></details>: 상세 정보를 담는 시맨틱 블록 태그
<summary></summary>: details로 구성되는 블록의 제목 표현

시맨틱 인라인 태그는
<mark></mark> 중요한 텍스트임을 표시
<time></time> 텍스트의 내용이 시간임을 표시
<meter></meter> 주어진 범위나 %의 데이터량 표시
<progress></progress> 작업의 진행 정도 표시 -->

<!-- 
<!DOCtYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>figure 태그 활용</title>
        </head>
        
        <body>
            <h3>figure 태그 활용</h3>
            <hr>
            <figure id="1-1">
                <figcaption>alert() 함수 활용</figcaption>
                <pre>
                    <code>funcion f{} { alert("경고합니다");; }</code>
                </pre>
                <hr>
                <small>실행결과</small>
                <pre>
                    <img src="images/alert.png" alt="실행결과">
                </pre>
            </figure>
        </body>
    </head>
</html>

code: 텍스트 내에서 컴퓨터 소스 코드를 나타낼 때 사용
small: 부수적이고 중요도가 낮은 텍스트(글씨를 줄이는 것 뿐만 아닌 내용의 성격도 강조) -->
