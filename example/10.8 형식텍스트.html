<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>자기 소개 폼</title>
    </head>

    <body>
        <form>
            <fieldset>
            이름  <input type="text" placeholder="홍길동"><br>
            닉네임  <input type="text" placeholder="10자 이내"><br>
            학과  <input type="text" placeholder="학과를 입력하세요"><br>
            학번 <input type="text" placeholder="숫자 8자리"><br>
            
            학년 <input type="radio" name="grade">1학년
            <input type="radio" name="grade">2학년
            <input type="radio" name="grade">3학년
            <input type="radio" name="grade">4학년<br>
            
            성별 <input type="radio" name="gender">남
            <input type="radio" name="gender">여
            <input type="radio" name="gender">선택 안 함<br>
            
            이메일 email : <input type="email" placeholder="ld@example.com"><br>
            전화번호 : <input type="tel" placeholder="010-0000-0000">
            </fieldset>

        </form>
    </body>
</html>
