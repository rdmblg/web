<!-- 비디오 태그
<video></video>
src: 비디오 파일의 URL
width, height
controls 제어 버튼 출력
autoplay 비디오 로딩 즉시 재생
muted 오디오 끌 때 사용
loop 반복 재생 -->

<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>비디오 삽입</title>
    </head>

    <body>
        <h3>비디오 삽입</h3>
        <hr>
        <video src="images/bear.mp4" controls>
            브라우저가 video 태그를 지원하지 않습니다.
        </video>
    </body>
</html>


<video width="320" height="240" controls>
    <source src="images/bear.mp4" type="video/mp4">
    브라우저가 지원안함
</video>
