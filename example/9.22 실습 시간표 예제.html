<!-- <tr></tr>태그의 속성
align(left(디폴트), right, center)      행 전체의 수평 정렬 방식
width(n, %)                     행의 가로 넓이 지정
height(n, %)                    행의 세로 높이 지정
bgcolor(색상, 색상코드)         행의 색상
backgroung(url, 파일명)         행의 배경 이미지

<td></td>, <th></th> 태그의 속성
valign(top, middle(디폴트), bottom) 셀의 수직 정렬 방식
align(left(디폴트), right, center) 셀의 수평 정렬 방식
width(n, %)     셀의 가로 넓이 지정
height(n, %)                    셀의 세로 높이 지정
bgcolor(색상, 색상코드)         셀의 색상
backgroung(url, 파일명)         셀의 배경 이미지
rowspan(숫자)               행 합치기(셀을 세로로 통합)
colspan(숫자)               열 합치기(셀을 가로로 통합) -->
