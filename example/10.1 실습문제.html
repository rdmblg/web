<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>실습문제</title>
    </head>

    <body>
        <header>
            <h3>웹 브라우저 소개</h3>
            <hr>
        </header>

        <table>
            <tr><td>브라우저라고 불리기도하는 웹 브라<br>
                우저(Web Browser)는, 사용자에게 웹<br>
                서버 컴퓨터에 접속하고 웹 페이지,<br>
                이미지, 동영상, 음악 등 다양한 데이<br>
                터 다운받아 보여주는 소프트웨어이<br>
                다. <b>그림 1-2</b>는 대표적인 Chrome 웹<br>
                브라우저를 보여준다.
            </td>

            <figure>
                <td>
                <img src="images/cafelatte.jpg">
                <figcaption>그림 1-2 구글 Chrome</figcaption></td>
            </figure>
            </tr>
            
            <tr><td>웹 페이지는 브라우저에 HTML5 문<br>
            서임을 알리기 위해 <b>그림 1-3</b>과 같은<br>
            코드를 첫 라인에 삽입하여야 한다.</td>
        
            <td>
            <code>
                <figure>
                    <b>&lt;!DOCTYPE html&gt;</b><br>
                    &lt;html&gt;<br>
                    ...<br>
                    &lt;/html&gt;<br>
                    <figcaption>그림 1-3 HTML5 문서 구성</figcaption>
                </figure>
            </code>
            그림 1-3 HTML5 문서 구성
            </td>
        </tr>

        </table>
    </body>
</html>
