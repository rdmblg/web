<!-- 인라인 프레임 만들기
:HTML 페이지 내에 내장 윈도우 만들기

<iframe>이 사이에 낀 건
    iframe 태그를 다루지 않는 브라우저에 의해 대신 출력되는 텍스트
</iframe>

src: URL 주소
srcdoc: 직접 HTML 태그로 작성된 텍스트로서 출력될 내용
name: 프레임 윈도우의 이름, 다른 웹 페이지에서 target 속성 값 사용
<a href="https://www.naver.com" target="myframe">네이버 열기</a>
<a href="https://www.daum.net" target="myframe">다음 열기</a>

<iframe name="myframe" width="400" height="300"></iframe>
처럼 iframe name 값에 속성을 지정해두면 target으로 파일이 이동할 때 인라인 프레임 안에서 열림

width: 디폴트 300
height: 디폴트 150 -->

<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>iframe</title>
    </head>

    <body>
        <h3>2개의 신문 사이트입니다.</h3>
        <hr>
        
        <iframe src="https://www.naver.com/" width="300" height="100"></iframe><br>
        <iframe src="9.29 하이퍼링크.html">출력이 안됩니다.</iframe>

        <a href="9.29 하이퍼링크.html#네이버링크" target="a">인라인프레임 하이퍼링크</a>
        <iframe name="a"></iframe>
    </body>
</html>
