<head>
    <style>
        a {color: green; text-decoration: none;}
        a:hover {color: violet;
        text-decoration: underline;}
    </style>
</head>

<body>
    <h3>링크 꾸미기</h3>
    <br>
    <p>초록색에 밑줄없는 링크, 마우스를 올리면 밑줄과 violet 색으로 변경</p>
    <hr>
    <ul>
        <li><a href="">네이버 사이트</a></li>
        <li><a href="">구글 사이트</a></li>
    </ul>
</body>
