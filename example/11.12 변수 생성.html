<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>변수 생성</title>
    </head>

    <body>
        <script>
        let k = 100;      // 변수 k 생성, 100 저장
        let m = 200;      // 변수 m 생성, 200 저장
        let total = k + m;  // k와 m을 더해 total에 저장
 
        document.write("k = ", k, "<br>");
        document.write("m = ", m, "<br>");
        document.write("합계 : ", total);
        </script>
    </body>
</html>
