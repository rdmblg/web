<!DOCTYPE html> 현재 문서가 HTML5로 작성한 웹 문서임을 나타냄

<!--이 부분은 주석문입니다. 웹 브라우저는 주석을 화면에 출력하지 않습니다.-->
<html>
	<head>
		<title>HTML, CSS, Javascript 소개</title>
	</head>
	<body>
		문서의 본문 텍스트, 이미지, 테이블, 자바스크립트 코드, 동영상 등
	</body>

HTML은 웹 문서를 작서하는 태그 언어(HyperText Markup Lanbuage)
태그 : 웹페이지 내용을 구조화하고 의미를 부여하는데 사용되는 명령어
마크업 : 기호를 사용하여 구조와 의미를 부여하는 행위

필수 태그
: <html></html>, <head></head>, <title></title>, <body></body>
