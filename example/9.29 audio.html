<!-- audio 태그

src: URL
controls: 제어 버튼 출력
autoplay: 비디오 로딩 즉시 재생
loop: 반복 재생 -->

<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>오디오 삽입</title>
    </head>

    <body>
        <h3>오디오 삽입</h3>
        <hr>
        
        재생 버튼을 누르면 음악이 연주됩니다.
        <audio src="images/EmbraceableYou.mp3" controls loop>
            브라우저가 audio 태그를 지원하지 않습니다.
        </audio>
    </body>
</html>


<audio controls>
    <source src="images/EmbraceableYou.mp3" type="audio/mpeg">
    <source src="images/EmbraceableYou.mp3" type="audio/ogg">
    브라우저가 audio 태그를 지원하지 않습니다.
</audio>

<!--mp3재생못하면 저거 선택-->
