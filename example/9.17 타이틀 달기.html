<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">

    <title>첫 타이틀</title>
    </head>

    <body>
        페이지에 타이틀을 다는 예제입니다
        타이틀은 브라우저의 타이틀바에 보여집니다.
    </body>
</html>

utf-8은 유니코드의 일종, 문자 인코딩(코드화, 암호화)방법
일반적으로 영어는 1바이트, 한글은 3바이트
안쓰면 한글이 깨질수도

meta태그: 페이지에 대한 메타데이터를 적어두는 태그, 화면엔 안보이고 브라우저나 검색엔진이 읽음
