<!-- 시맨틱태그: 이름만 보고도 안에 든 내용의 역할과 의미를 쉽게 이해할수 있는 태그
구조만 만드는 div에 비해 역할 전달까지 도와줌

<header></header> 웹페이지나 섹션의 머리글 부분을 나타냄(로고, 네비게이션 메뉴 등이 포함)
<nav></nav> 네비게이션 링크를 정의
<section></section>, <article></article> 관련 있는 콘텐츠 그룹을 정의, 웹 페이지의 특정 섹션을 나눌 때 사용
<aside></aside> 주요 콘텐츠와는 별개의 부가적인 정보
<footer></footer> 바닥글 부분(저작권 정보, 연락처 포함)
<figure></figure> 이미지, 도표 등 시각적 콘텐츠
<figcaption></figcaption> <figure></figure>로 감싼 콘텐츠에 대한 설명 제공

개발자가 css를 참고하여 직접 위치와 색, 모양을 지정해야함 -->

<!DOCtyPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>HTML5 문서 구조</title>
        <style>
            html, body { margin: 0; padding: 0; height: 100%;}
            /* 부모 높이를 정해줌 */
            header { width: 100%; height: 15%; background-color: aliceblue;}
            nav { width: 15%; height: 70%; float: left; background-color: darkgray;}
            section{ width: 70%; height: 70%; float: left; background-color: antiquewhite;}
            aside{ width: 15%; height: 70%; float: left; background-color: floralwhite;}
            footer{ width: 100%; height: 15%; clear: both; background: yellow;} 
            /* background 와 background-color의 차이: 그냥 background는 몽땅이고 후자는 색상만   */
        </style>
    </head>

    <body>
        <header>header</header>
        <nav>nav</nav>
        <section>section</section>
        <aside>aside</aside>
        <footer>footer</footer>
    </body>
</html>
