<!-- 이미지 테두리 만들기
border-image
1. 테두리에 이미지를 입힘
2. 모서리와 에지로 구분하여 각각 이미지 입힘
3. border-width와 border-style 미리 지정 필요

예)
border-image에서 39픽셀 크기 조각으로 이미지 테두리 만들기
border-image : url("border.png") 30 round;
이미지 URL, 임지를 30픽셀 조각을 떼어내 모서리에 배치, 에지 이미지 반복 배치

round - 에지 이미지 반복 배치, 테두리 길이만큼
repeat - 에지 이미지 반복 배치
stretch - 에지 이미지를 테두리 길이만큼 늘여 배치 -->

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>이미지 테두리 만들기</title>
<style>
p {
	background : yellow;
	width : 200px; 
	height : 60px;
	padding : 10px; 
	border : 20px solid lightgray; /*border-width와 border-style 동시 지정 */
}
#round { border-image: url("images/border.png") 30 round; }
#repeat { border-image: url("images/border.png") 30 repeat; }
#stretch { border-image: url("images/border.png") 30 stretch; }
</style>
</head>
<body>
<h3>이미지 테두리 만들기</h3>
<hr>
다음은 원본 이미지입니다.<br>
<img src="images/border.png" alt="원본">
<hr>
<p>20x20 크기의 회색 테두리를 가진 P 태그</p>
<p id="round">round 스타일 이미지 테두리</p>
<p id="repeat">repeat 스타일 이미지 테두리</p>
<p id="stretch">stretch 스타일 이미지 테두리</p>
</body>
</html>
