<script>
let x = 13, y = 7;
document.write("x == y : ", (x == y), "<br>");
document.write("x != y : ", (x != y), "<br>");
document.write("x >= y : ", (x >= y), "<br>");
document.write("x > y  : ", (x > y));

let a = 3, b = 4;
document.write("<br>", "<br>", "a==3 && b==7 : ", (a==3 && b==7), "<br>");
document.write("a==3 || b==4 : ", (a==3 || b==4), "<br>");
document.write("!(a==3) : ", !(a==3));
</script>
