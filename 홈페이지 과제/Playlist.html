<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Playlist</title>
        <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR&family=IBM+Plex+Sans+KR&display=swap" rel="stylesheet">
        <style>
            body {
                margin: 0;
                color: #111;
                font-family: "IBM Plex Sans KR"
            }

            .wrap {
                max-width: 760px;
                margin: 0 auto;
                padding: 80px 24px 100px;
            }

            .head {
                display: flex;
                align-items: flex-end;
                gap: 32px;
                margin-bottom: 60px;
            }

            hr {color: #888;}

            .cover {
                width: 200px;
                height: 200px;
                flex-shrink: 0;
            }

            .label {
                font-size: 12px;
                letter-spacing: 2px;
            }

            h1 {
                font-size: 40px;
            }

            .info {
                font-size: 14px;
            }

             .list-head,
            .song {
                display: flex;
                align-items: center;
                padding: 12px 16px;
            }
            .list-head {
                font-size: 12px;
            }

            .song:hover {
                background-color: #eee;
            }
 

            .no    { width: 40px; font-size: 14px;}
            .title { flex: 1;}
            .memo  { width: 220px; font-size: 13px;}
 
            .name {
                display: inline-block;
            }
            .name b {
                display: block;
            }
        </style>
    </head>

    <body>
    <div class="wrap">
 
            <div class="head">
                <img src="images/img3.jpg" class="cover" alt="오류">
                <div>
                    <p class="label">PLAYLIST</p>
                    <h1>겨울 플레이리스트</h1>
                    <p class="info">요즘 자주 듣는 노래</p>
                </div>
            </div>
 
            <div class="list-head">
                <div class="no">#</div>
                <div class="title">제목</div>
                <div class="memo">좋아하는 가사</div>
            </div>

            <hr>
 
            <div class="song">
                <div class="no">1</div>
                <div class="title">
                    <div class="name"><b>F.U.Y</b><span>데이먼스이어</span></div>
                </div>
                <div class="memo">언젠가 모든 걸 다 잃게 되더라도 넌 슬퍼하지 마</div>
            </div>
 
            <div class="song">
                <div class="no">2</div>
                <div class="title">
                    <div class="name"><b>눈사람</b><span>정승환</span></div>
                </div>
                <div class="memo">그대 반드시 행복해지세요</div>
            </div>
 
            <div class="song">
                <div class="no">3</div>
                <div class="title">
                    <div class="name"><b>너의 기사</b><span>데이먼스 이어</span></div>
                </div>
                <div class="memo">아무도 너의 슬픔을 알아주지 않지</div>
            </div>
 
            <div class="song">
                <div class="no">4</div>
                <div class="title">
                    <div class="name"><b>Mondegreen</b><span>데이먼스 이어</span></div>
                </div>
                <div class="memo">그대는 노래 말고 사랑이나 되어주지</div>
            </div>
 
            <div class="song">
                <div class="no">5</div>
                <div class="title">
                    <div class="name"><b>내 사랑 내 곁에</b><span>김결</span></div>
                </div>
                <div class="memo">당신의 그 웃음 뒤에서 함께 하는데</div>
            </div>
 
            <div class="song">
                <div class="no">6</div>
                <div class="title">
                    <div class="name"><b>Sleep tight</b><span>E SENS</span></div>
                </div>
                <div class="memo">깨고나면 여기가 아닌 다른 곳이길 바라지만 난 여기 있고</div>
            </div>
        </div>
    </body>
</html>
