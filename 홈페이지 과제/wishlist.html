<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Playlist</title>
        <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR&family=IBM+Plex+Sans+KR&display=swap" rel="stylesheet">
        <style>
            body {
                margin: 0;
                color: #111;
                font-family: "IBM Plex Sans KR"
            }

            .wrap {
                max-width: 760px;
                margin: 0 auto;
                padding: 80px 24px 100px;
            }

            .head {
                display: flex;
                align-items: flex-end;
                gap: 32px;
                margin-bottom: 60px;
            }

            hr {color: #888;}

            .cover {
                width: 200px;
                height: 200px;
                flex-shrink: 0;
            }

            .label {
                font-size: 12px;
                letter-spacing: 2px;
            }

            h1 {
                font-size: 40px;
            }

            .info {
                font-size: 14px;
            }

             .list-head,
            .song {
                display: flex;
                align-items: center;
                padding: 12px 16px;
            }
            .list-head {
                font-size: 12px;
            }

            .song:hover {
                background-color: #eee;
            }
 

            .no    { width: 40px; font-size: 14px;}
            .title { flex: 1;}
            .memo  { width: 220px; font-size: 13px;}
 
            .name {
                display: inline-block;
            }
            .name b {
                display: block;
            }
        </style>
    </head>

    <body>
    <div class="wrap">
 
            <div class="head">
                <img src="images/img2.jpg" class="cover" alt="오류">
                <div>
                    <p class="label">BUCKET LIST</p>
                    <h1>해보고 싶은 것</h1>
                    <p class="info">죽기 전에 이건 해봐야지</p>
                </div>
            </div>
 
            <div class="list-head">
                <div class="no">#</div>
                <div class="title">하고 싶은 일</div>
                <div class="memo">진행도</div>
            </div>

            <hr>
 
            <div class="song">
                <div class="no">1</div>
                <div class="title">
                    <div class="name"><b>두바이 쫀득 쿠키 먹어보기</b></div>
                </div>
                <div class="memo">완료!</div>
            </div>
 
            <div class="song">
                <div class="no">2</div>
                <div class="title">
                    <div class="name"><b>내 홈페이지 만들기</b></div>
                </div>
                <div class="memo">진행 중</div>
            </div>
 
            <div class="song">
                <div class="no">3</div>
                <div class="title">
                    <div class="name"><b>젤리 쌓아놓고 먹기</b></div>
                </div>
                <div class="memo">진행 전</div>
            </div>
 
            <div class="song">
                <div class="no">4</div>
                <div class="title">
                    <div class="name"><b>마라탕 왕창 먹기</b></div>
                </div>
                <div class="memo">진행 전</div>
            </div>
 
            <div class="song">
                <div class="no">5</div>
                <div class="title">
                    <div class="name"><b>전기장판 위에서 귤까먹기</b></div>
                </div>
                <div class="memo">완료!</div>
            </div>
 
            <div class="song">
                <div class="no">6</div>
                <div class="title">
                    <div class="name"><b>눈사람 만들기</b></div>
                </div>
                <div class="memo">진행 전</div>
            </div>
        </div>
    </body>
</html>
